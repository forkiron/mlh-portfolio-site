# Rate limit: 1 POST per minute per IP on the timeline API.
# The map keys the zone by client IP for POSTs only, so GETs (the page
# reading the feed) are never limited — an empty key is not rate limited.
map $request_method $timeline_post_ip {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $timeline_post_ip zone=timelinepost:10m rate=1r/m;

server {
    listen 80;
    server_name thomas-lenh-portfolio.duckdns.org;

    if ($host = thomas-lenh-portfolio.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name thomas-lenh-portfolio.duckdns.org;

    location = /api/timeline_post {
        limit_req zone=timelinepost;
        limit_req_status 429;
        proxy_pass http://myportfolio:5000;
    }

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    # Load the certificate files.
    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
}
